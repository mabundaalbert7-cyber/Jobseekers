<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in or Sign up</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <header class="top">
    <div class="account"><a href="index.html">&larr; Back to jobs</a></div>
    <h1>Log in or sign up</h1>
    <p>Free. Your account is remembered on this phone until you log out.</p>
  </header>
  <main id="authBox" class="authbox">
    <p id="message" class="message" role="status"></p>

    <form id="signupForm" class="card">
      <h2>Create an account</h2>
      <label>Your name <input id="suName" required autocomplete="name"></label>
      <label>Email <input id="suEmail" type="email" required autocomplete="email"></label>
      <label>Password (6+ characters) <input id="suPass" type="password" minlength="6" required autocomplete="new-password"></label>
      <button class="apply" type="submit">Sign up</button>
    </form>

    <form id="loginForm" class="card">
      <h2>Already have an account?</h2>
      <label>Email <input id="liEmail" type="email" required autocomplete="email"></label>
      <label>Password <input id="liPass" type="password" required autocomplete="current-password"></label>
      <button class="apply" type="submit">Log in</button>
      <p><a id="resetLink" href="#">Forgot password?</a></p>
    </form>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
